name=LionDallas
version=1.0.0
author=leva <leva.the.lion@gmail.com>
maintainer=leva <leva.the.lion@gmail.com>
sentence=Compact DS18B20 driver over OneWire for the Lion* stack (ESP8266).
paragraph=Discovers DS18B20 addresses once at startup and keeps them (cures "the second sensor drops off"); reads them non-blocking inside a LionCriticalTask; caches the last good reading and rides out transient -127/fault values for a tolerance window. Includes the DallasTemperature 4.0.6 power-on-reset / insufficient-power / fault detection. Optional fixed addresses skip the unreliable SearchROM on long wiring (read by MatchROM). DS18B20 family (0x28) only. The consumer defines one global LionLogger Logger and pumps LionTask::Loop() from loop(). Portions ported from the Arduino Temperature Control Library (c) Miles Burton, MIT. ESP8266 only (on ESP32 there is no LionCriticalTask).
category=Sensors
url=https://github.com/blah188/LionDallas
architectures=esp8266
depends=OneWire,LionArray,LionLogger,LionTask
includes=LionDallas.h
